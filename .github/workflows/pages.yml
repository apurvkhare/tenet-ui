name: Docs + Storybook (Cloudflare Pages)

# Deploys the docs site (at /) and the static Storybook (at /storybook/) to Cloudflare Pages on
# every push to main and on release tags. Preview deployments for pull requests get a branch URL.
# Secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
# The docs site emits llms.txt / llms-full.txt / llms-small.txt for the guideline adapter.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://tenet-ui.pages.dev
  PAGES_PROJECT: tenet-ui

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build package, Storybook and docs into _site/
        run: node scripts/build-site.mjs
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
      - name: Notify the design-system MCP server's guidelines webhook (optional, main only)
        if: ${{ github.ref == 'refs/heads/main' && env.DS_SERVER_GUIDELINES_URL != '' }}
        run: |
          curl -fsS -X POST "$DS_SERVER_GUIDELINES_URL" \
            -H "Authorization: Bearer $DS_SERVER_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"package\":\"tenet-ui\",\"docs\":\"${SITE_URL}/\",\"llms\":\"${SITE_URL}/llms.txt\",\"commit\":\"${GITHUB_SHA}\"}"
        env:
          DS_SERVER_GUIDELINES_URL: ${{ secrets.DS_SERVER_GUIDELINES_URL }}
          DS_SERVER_INGEST_TOKEN: ${{ secrets.DS_SERVER_INGEST_TOKEN }}
